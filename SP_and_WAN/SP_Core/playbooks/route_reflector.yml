---
- name: Configure BGP Route Reflector topology
  hosts: R1,R2,R3,R4,R5
  gather_facts: no
  vars_files:
    - "../secrets.yml"

  vars:
    ansible_user: "{{ ssh_username }}"
    ansible_ssh_pass: "{{ ssh_password }}"
    ansible_connection: network_cli
    ansible_network_os: cisco.ios.ios

    as_number: 65000

    # Loopback IPs per router
    loopbacks:
      R1: 1.1.1.1
      R2: 2.2.2.2
      R3: 3.3.3.3
      R4: 4.4.4.4
      R5: 5.5.5.5

    # Define RR servers and clients
    rr_servers:
      - R4   # primary
      - R2   # backup

    rr_clients:
      - R1
      - R3
      - R5

  tasks:

    - name: Configure Route Reflector neighbors
      cisco.ios.ios_config:
        parents: "router bgp {{ as_number }}"
        lines: |
          {% if inventory_hostname in rr_servers %}
          {% for client in rr_clients %}
          neighbor {{ loopbacks[client] }} remote-as {{ as_number }}
          neighbor {{ loopbacks[client] }} route-reflector-client
          neighbor {{ loopbacks[client] }} update-source Loopback0
          {% endfor %}
          {% endif %}
      notify: Save Configuration

    - name: Configure RR clients to peer with RRs
      cisco.ios.ios_config:
        parents: "router bgp {{ as_number }}"
        lines: |
          {% if inventory_hostname in rr_clients %}
          {% for rr in rr_servers %}
          neighbor {{ loopbacks[rr] }} remote-as {{ as_number }}
          neighbor {{ loopbacks[rr] }} update-source Loopback0
          {% endfor %}
          {% endif %}
      notify: Save Configuration

  handlers:
    - name: Save Configuration
      cisco.ios.ios_command:
        commands:
          - command: copy running-config startup-config
            prompt: 'Destination filename \[startup-config\]\?'
            answer: "\r"
