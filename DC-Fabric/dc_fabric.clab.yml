name: dc-fabric

topology:
  kinds:
    ceos:
      image: ceos:4.28.13.1M
  
  defaults:
    kind: ceos
    startup-config: ceos-base.cfg
    env:
      INTFTYPE: eth
      CEOS: 1
      SKIP_ASIC_CONFIG: GNS3
      ETBA: 1

  nodes:
    border1: { mgmt-ipv4: 172.20.20.10 }
    spine1:  { mgmt-ipv4: 172.20.20.11, startup-delay: 20 }
    spine2:  { mgmt-ipv4: 172.20.20.12, startup-delay: 40 }
    leaf1:   { mgmt-ipv4: 172.20.20.21, startup-delay: 60 }
    leaf2:   { mgmt-ipv4: 172.20.20.22, startup-delay: 80 }
    leaf3:   { mgmt-ipv4: 172.20.20.23, startup-delay: 100 }
    leaf4:   { mgmt-ipv4: 172.20.20.24, startup-delay: 120 }

    CUST_A_HOST1:
      kind: linux
      image: alpine:latest

    CUST_A_HOST2:
      kind: linux
      image: alpine:latest

    CUST_A_HOST3:
      kind: linux
      image: alpine:latest

  links:
    - endpoints: ["border1:eth1", "spine1:eth1"]
    - endpoints: ["border1:eth2", "spine2:eth1"]
    - endpoints: ["spine1:eth2", "leaf1:eth1"]
    - endpoints: ["spine1:eth3", "leaf2:eth1"]
    - endpoints: ["spine1:eth4", "leaf3:eth1"]
    - endpoints: ["spine1:eth5", "leaf4:eth1"]
    - endpoints: ["spine2:eth2", "leaf1:eth2"]
    - endpoints: ["spine2:eth3", "leaf2:eth2"]
    - endpoints: ["spine2:eth4", "leaf3:eth2"]
    - endpoints: ["spine2:eth5", "leaf4:eth2"]
    - endpoints: ["leaf2:eth4", "leaf3:eth4"]
    - endpoints: ["leaf2:eth5", "leaf3:eth5"]
    - endpoints: ["CUST_A_HOST1:eth1", "leaf1:eth5"]
    - endpoints: ["CUST_A_HOST2:eth1", "leaf2:eth6"] 
    - endpoints: ["CUST_A_HOST2:eth2", "leaf3:eth6"] 
    - endpoints: ["CUST_A_HOST3:eth1", "leaf4:eth5"]
    - endpoints: ["border1:eth3", "host:br-gns3"]
